<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <style>
    body { width: 220px; padding: 15px; font-family: Arial, sans-serif; text-align: center; }
    button { padding: 10px; width: 100%; margin-top: 10px; cursor: pointer; font-weight: bold; border-radius: 5px; border: 1px solid #ccc; }
    #startBtn { background-color: #4CAF50; color: white; border: none; }
    #startBtn:hover { background-color: #45a049; }
    #stopBtn { background-color: #f44336; color: white; border: none; }
    #stopBtn:hover { background-color: #da190b; }
    #status { margin-bottom: 10px; font-weight: bold; font-size: 14px;}
  </style>
</head>
<body>
  <div id="status">Trạng thái: Đang Tắt</div>
  <button id="startBtn">▶ Bắt Đầu Duyệt</button>
  <button id="stopBtn">⏹ Dừng Lại</button>
  <script src="popup.js"></script>
</body>
</html>
